<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cerberus mark, 1024 master: the gate (three gapped rings and a core, open), flat and solid white on a plain black tile, in the spirit of the Vercel triangle. The innermost ring is the only colour: sharp spectrum bands. No glow, halo or shading. The in-app GateMark is the same drawing without the tile. -->
  <defs><clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#000"/>
    <g transform="translate(188 188) scale(27)">
    <defs><linearGradient id="bands" gradientUnits="userSpaceOnUse" x1="8.15" y1="14.7" x2="15.85" y2="9.3"><stop offset="0" stop-color="#FF4545"/><stop offset="0.2" stop-color="#FF4545"/><stop offset="0.2" stop-color="#FFB020"/><stop offset="0.4" stop-color="#FFB020"/><stop offset="0.4" stop-color="#3DDC6A"/><stop offset="0.6" stop-color="#3DDC6A"/><stop offset="0.6" stop-color="#3B8BFF"/><stop offset="0.8" stop-color="#3B8BFF"/><stop offset="0.8" stop-color="#9A6BFF"/><stop offset="1" stop-color="#9A6BFF"/></linearGradient></defs>
    <circle cx="12" cy="12" r="10.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="58.06 7.92" stroke-dashoffset="45.52"/>
    <circle cx="12" cy="12" r="7.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="38.00 7.24" stroke-dashoffset="30.31"/>
    <circle cx="12" cy="12" r="3.9" fill="none" stroke="url(#bands)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="18.62 5.88" stroke-dashoffset="15.44"/>
    <circle cx="12" cy="12" r="1.4" fill="#fff"/>
    </g>
  </g>
</svg>
