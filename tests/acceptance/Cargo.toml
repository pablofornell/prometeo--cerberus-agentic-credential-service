[package]
name = "cerberus-acceptance"
description = "Acceptance suite A1-A12 (docs/PLAN.md section 11). Tests only, no library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

# No normal dependencies: the suite only has tests, so the dependency-direction check has nothing to allow (DEC-T24-1).
[dev-dependencies]
cerberus-api.workspace = true
cerberus-client.workspace = true
cerberus-core.workspace = true
cerberus-crypto.workspace = true
cerberus-mcp.workspace = true
cerberus-store.workspace = true
cerberus-types.workspace = true
jiff.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { workspace = true, features = ["tls12"] }
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-rustls.workspace = true
