# Release: builds the installers and binaries on Linux, macOS and Windows, writes SBOMs and SHA256SUMS and publishes a
# GitHub release. Start it by pushing a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`, published as a pre-release) that matches the
# version in Cargo.toml and tauri.conf.json. A manual run (workflow_dispatch) builds everything and makes no release.
#
# Files go straight from each build job to a draft release (`gh release upload`), not through workflow artifacts, so
# the account's artifact storage quota never blocks a release. The last job checks every file, writes SHA256SUMS,
# attests provenance (public repositories only: GitHub does not offer attestations on private user repositories) and
# turns the draft into a published release. Every action is pinned to a commit SHA.
# Guide and secrets: docs/guides/packaging-and-release.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The tag, the workspace version and the Tauri version must be the same. Fails before any build.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.versions.outputs.version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        id: versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          tauri_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "Cargo.toml $cargo_version, tauri.conf.json $tauri_version"
          test -n "$cargo_version"
          test "$cargo_version" = "$tauri_version"
          if [ "$REF_TYPE" = tag ]; then test "v$cargo_version" = "$REF_NAME" || { echo "tag $REF_NAME does not match $cargo_version"; exit 1; }; fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          case "$cargo_version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  # The same gates as pull requests. A release never ships from a commit that fails them.
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # An empty draft release the build jobs attach their files to. Kept as a draft (invisible to the public) until every
  # file is there. A re-run of a tag reuses the existing release.
  draft:
    needs: [preflight, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "release $TAG is already published; cut a new tag instead of rebuilding it in place"; exit 1
            fi
            echo "draft $TAG exists: the build jobs replace its files"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Cerberus $VERSION"
          fi

  linux:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # gh release upload; every pinned action in this job can see the token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-cyclonedx
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri CLI version matches the `tauri` crate line; rust-cache keeps ~/.cargo/bin between runs.
      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version 2.12.4
      - name: Desktop installers (deb, rpm, AppImage)
        env:
          # linuxdeploy is an AppImage itself and the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: just package
      - run: just package-binaries
      - run: just sbom
      - name: Release files
        run: ls -la dist/
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
      # A manual run keeps the files for 3 days. Artifact storage may be full: that does not fail the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          name: dist-linux
          path: dist/
          retention-days: 3
          if-no-files-found: error

  # macOS (Apple silicon) and Windows (x64). Signing is optional: without the secrets the installers are unsigned and the
  # guide says how a user checks them (SHA256SUMS and, on a public repository, the provenance attestation).
  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-2025
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write # gh release upload; every pinned action in this job can see the token
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri CLI version matches the `tauri` crate line; rust-cache keeps ~/.cargo/bin between runs.
      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version 2.12.4
      - name: Are the Apple signing secrets set
        id: signing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Desktop installer (signed and notarized)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just package
      - name: Desktop installer (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: just package
      - run: just package-binaries
      - name: Release files
        run: ls -la dist/
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  # Every platform attached its files: write SHA256SUMS over all of them, attest them, publish the release.
  publish:
    needs: [preflight, linux, desktop]
    # Only a tag push makes a release. A manual run (even on a tag) stops after the builds.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload SHA256SUMS, publish the release
      id-token: write # keyless signing of the provenance (Sigstore)
      attestations: write # store the provenance attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the release files
        run: |
          gh release download "$TAG" --dir dist --clobber
          rm -f dist/SHA256SUMS
          ls -la dist/
      # One installer and one tarball per platform at least, so a silent build gap never ships.
      - name: Every platform is there
        run: |
          cd dist
          ls -- *.deb *.rpm *.AppImage *.dmg *-setup.exe *_bin.cdx.json >/dev/null
          ls cerberus-*-x86_64-unknown-linux-gnu.tar.gz cerberus-*-aarch64-apple-darwin.tar.gz \
            cerberus-*-x86_64-pc-windows-msvc.tar.gz >/dev/null
      - name: SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Provenance of every release file
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
