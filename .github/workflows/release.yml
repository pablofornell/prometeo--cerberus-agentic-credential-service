# Release: builds the installers and binaries on Linux, macOS and Windows, writes SBOMs and SHA256SUMS, attaches build
# provenance and opens a DRAFT GitHub release for a person to review and publish. Start it with a tag `vX.Y.Z` that
# matches the version in Cargo.toml and tauri.conf.json, or by hand (workflow_dispatch: builds and uploads artifacts,
# no release). Every action is pinned to a commit SHA. Guide and secrets: docs/guides/packaging-and-release.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The tag, the workspace version and the Tauri version must be the same. Fails before any build.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          tauri_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "Cargo.toml $cargo_version, tauri.conf.json $tauri_version"
          test "$cargo_version" = "$tauri_version"
          if [ "$REF_TYPE" = tag ]; then test "v$cargo_version" = "$REF_NAME" || { echo "tag $REF_NAME does not match $cargo_version"; exit 1; }; fi

  # The same gates as pull requests. A release never ships from a commit that fails them.
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  linux:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-cyclonedx
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri CLI version matches the `tauri` crate line; rust-cache keeps ~/.cargo/bin between runs.
      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version 2.12.4
      - name: Desktop installers (deb, rpm, AppImage)
        env:
          # linuxdeploy is an AppImage itself and the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: just package
      - run: just package-binaries
      - run: just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  # macOS (Apple silicon) and Windows (x64). Signing is optional: without the secrets the installers are unsigned and the
  # guide says how a user checks them (SHA256SUMS and the provenance attestation).
  desktop:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: windows-2025
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri CLI version matches the `tauri` crate line; rust-cache keeps ~/.cargo/bin between runs.
      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version 2.12.4
      - name: Are the Apple signing secrets set
        id: signing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Desktop installer (signed and notarized)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just package
      - name: Desktop installer (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: just package
      - run: just package-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [linux, desktop]
    # Only a tag makes a release. A manual run stops after the artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # keyless signing of the provenance (Sigstore)
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: just checksums
      - name: Provenance of every release file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
          generate_release_notes: true
