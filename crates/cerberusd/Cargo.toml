[package]
name = "cerberusd"
description = "Cerberus headless daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cerberus-api.workspace = true
cerberus-core.workspace = true
cerberus-mcp.workspace = true
cerberus-crypto.workspace = true
cerberus-store.workspace = true
cerberus-types.workspace = true
clap.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client", "client-legacy"] }
http-body-util.workspace = true
bytes.workspace = true
rpassword.workspace = true
rustix.workspace = true
rustls.workspace = true
sd-notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zeroize.workspace = true

[dev-dependencies]
# Fast KDF for tests only (DEC-050). A release build with this feature does not compile.
cerberus-crypto = { workspace = true, features = ["insecure-test-kdf"] }
tempfile.workspace = true
