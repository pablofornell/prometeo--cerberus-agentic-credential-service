[package]
name = "cerberus-mcp"
description = "Cerberus MCP server for agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The stdio shim (bin `cerberus-mcp`). Hosts of the server turn it off: they do not need an HTTP client.
default = ["shim"]
shim = ["dep:cerberus-client", "dep:data-encoding", "dep:hyper", "dep:tracing-subscriber"]

[[bin]]
name = "cerberus-mcp"
path = "src/main.rs"
required-features = ["shim"]

[dependencies]
cerberus-client = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
cerberus-types = { workspace = true }
cerberus-core.workspace = true
cerberus-api.workspace = true
axum.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
cerberus-crypto.workspace = true
cerberus-store.workspace = true
jiff.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
